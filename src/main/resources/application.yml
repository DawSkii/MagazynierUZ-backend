spring:
  application:
    name: magazynieruz-backend
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  profiles:
    active: ${active.profile:lcl}

security:
  jwt:
    secret-key: ${jwt.secret}
    expiration: ${jwt.expiration}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false